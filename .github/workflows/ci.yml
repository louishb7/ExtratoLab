name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile source, tests, and tools
        run: python -m compileall -q src tests tools

      - name: Run full pytest suite
        run: python -m pytest

      - name: Run offscreen UI test suite
        run: python -m pytest tests/ui -q

      - name: Check text IO with Windows default encoding
        if: runner.os == 'Windows'
        env:
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
        run: |
          python -c "import locale, sys; print('Default encoding:', locale.getencoding(), 'UTF-8 mode:', sys.flags.utf8_mode)"
          python -X warn_default_encoding -W error::EncodingWarning -m pytest tests/unit tests/integration tests/corpus -q
